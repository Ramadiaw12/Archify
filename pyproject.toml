[project]
name = "infosearchindocs"
version = "0.1.0"
description = "Agent NLP de résumé — RAG + LangGraph + Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Web Framework ──────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── LLM — Groq uniquement ─────────────────────────────────────────────
    "groq>=0.11.0",
    "httpx>=0.28.1",

    # ── LangChain / LangGraph ─────────────────────────────────────────────
    "langchain>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0,<0.4.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langgraph>=1.0.1",

    # ── RAG / Embeddings / Vector Store ───────────────────────────────────
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",

    # ── Extraction Documents ───────────────────────────────────────────────
    "pdfplumber>=0.11.9",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",

    # ── Base de données PostgreSQL ─────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # ── Authentification ───────────────────────────────────────────────────
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "google-auth>=2.35.0",

    # ── Utilitaires ────────────────────────────────────────────────────────
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
[tool.hatch.build.targets.wheel]
packages = ["backend"]